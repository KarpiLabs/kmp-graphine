<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:;">
    <title>KmpGraphine Web Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #1E1E1E;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #root {
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            user-select: none;
            pointer-events: auto;
        }

        input, button, select {
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="index.js"></script>
    <script>
        // Wait for WASM and bundle to load, then call main()
        function initApp() {
            try {
                // Try mainSimple first (basic demo, no Skiko)
                if (typeof window !== 'undefined' && window.mainSimple) {
                    console.log('Initializing basic demo...');
                    window.mainSimple();
                    console.log('Demo initialized successfully');
                    return;
                }
                // Fall back to full graph demo
                if (typeof window !== 'undefined' && window.main) {
                    console.log('Initializing full KmpGraphine...');
                    window.main();
                    console.log('KmpGraphine initialized successfully');
                    return;
                }
                console.warn('No entry point found, retrying...');
                setTimeout(initApp, 100);
            } catch (e) {
                console.error('Error initializing app:', e);
                console.error('Stack:', e.stack);
            }
        }

        // Give bundle time to load and WASM to initialize
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            setTimeout(initApp, 50);
        }
    </script>
</body>
</html>
