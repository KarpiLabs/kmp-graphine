<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:;">
    <title>KmpGraphine Web Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #1E1E1E;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #root {
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            user-select: none;
            pointer-events: auto;
        }

        input, button, select {
            user-select: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="index.js"></script>
    <script>
        // Call entry point after bundle loads
        setTimeout(() => {
            try {
                if (typeof main === 'function') {
                    console.log('Calling main()...');
                    main();
                } else {
                    console.error('main() not found. Available globals:', Object.keys(window).filter(k => k.includes('main') || k.includes('Main')));
                }
            } catch (e) {
                console.error('Error calling main():', e);
            }
        }, 200);
    </script>
</body>
</html>
